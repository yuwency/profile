<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吳玉雯 - 個人作品集 Portfolio</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body class="font-sans antialiased text-gray-800 bg-gray-900 min-h-screen flex flex-col items-center justify-center relative overflow-x-hidden">

    <!-- 背景暗色半透明與毛玻璃效果 -->
    <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 z-0">
        <div class="absolute inset-0 bg-black/30 backdrop-blur-[2px]"></div>
    </div>

    <!-- 頂部膠囊導覽列 (Navbar) -->
    <header class="w-[92%] max-w-7xl fixed top-4 z-50 bg-white/90 backdrop-blur-md py-3 px-6 rounded-full shadow-lg flex justify-between items-center">
        <div class="text-purple-600 font-black tracking-wider text-lg">YUWEN</div>
        
        <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-gray-600">
            <a href="#" class="bg-purple-50 text-purple-600 px-4 py-1.5 rounded-full border border-purple-200">首頁</a>
            <a href="#about" class="hover:text-purple-600 transition">簡介</a>
            <a href="#education" class="hover:text-purple-600 transition">學歷</a>
            <a href="#projects" class="hover:text-purple-600 transition">專案作品</a>
            <a href="https://github.com/yuwency" target="_blank" class="hover:text-purple-600 transition">GitHub</a>
            <a href="#contact" class="hover:text-purple-600 transition">聯絡方式</a>
        </nav>
    </header>

    <!-- 主體：毛玻璃個人卡片 -->
    <main class="relative z-10 w-[90%] max-w-3xl mt-24 mb-10">
        <div class="bg-white/40 backdrop-blur-xl border border-white/30 rounded-[40px] p-8 md:p-12 shadow-2xl flex flex-col items-center text-center">
            
            <!-- 大頭貼 (預設帶入 GitHub 頭像) -->
            <div class="w-32 h-32 md:w-36 md:h-36 rounded-full overflow-hidden border-4 border-white shadow-xl mb-6">
                <img src="https://github.com/yuwency.png" alt="吳玉雯" class="w-full h-full object-cover">
            </div>

            <!-- 姓名與裝飾 -->
            <div class="relative inline-block mb-2">
                <div class="absolute left-0 top-0 bottom-0 w-3 bg-purple-500/80 rounded-l-lg transform -translate-x-4"></div>
                <h1 class="text-4xl md:text-5xl font-black text-slate-900 tracking-wide px-2 bg-purple-100/60 rounded-r-lg">
                    吳玉雯
                </h1>
            </div>

            <p class="text-xs md:text-sm font-semibold tracking-[0.3em] text-slate-500 uppercase mb-4">
                YU WEN WU
            </p>

            <p class="text-sm md:text-base font-medium text-slate-700 mb-6 flex items-center justify-center gap-1">
                <span>國立聯合大學</span>
                <span class="text-slate-400">•</span>
                <span>資訊管理學系</span>
            </p>

            <!-- 專長標籤 -->
            <div class="flex flex-wrap justify-center gap-3 mb-8">
                <span class="bg-purple-100/80 text-purple-600 border border-purple-200 text-xs md:text-sm font-semibold px-4 py-1.5 rounded-full shadow-sm">
                    互動設計
                </span>
                <span class="bg-purple-100/80 text-purple-600 border border-purple-200 text-xs md:text-sm font-semibold px-4 py-1.5 rounded-full shadow-sm">
                    前端網頁開發
                </span>
                <span class="bg-purple-100/80 text-purple-600 border border-purple-200 text-xs md:text-sm font-semibold px-4 py-1.5 rounded-full shadow-sm">
                    系統架構與資料庫
                </span>
            </div>
        </div>
    </main>

</body>
</html>
