<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吳玉雯 - 個人作品集 Portfolio</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body class="font-sans antialiased text-gray-800 bg-gray-900 min-h-screen flex flex-col items-center justify-center relative overflow-x-hidden p-4">

    <!-- 背景圖片與暗色遮罩 (預設載入 images/bg1.jpg) -->
    <div id="bg-carousel" class="absolute inset-0 bg-cover bg-center z-0 transition-all duration-1000 ease-in-out" style="background-image: url('images/bg1.jpg');">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]"></div>
    </div>

    <!-- 頂部膠囊導覽列 (Navbar) -->
    <header class="w-[92%] max-w-7xl fixed top-4 z-50 bg-white/90 backdrop-blur-md py-3 px-6 rounded-full shadow-lg flex justify-between items-center">
        <div class="text-purple-600 font-black tracking-wider text-lg">YUWEN</div>
        
        <nav class="hidden md:flex items-center space-x-6 text-xs md:text-sm font-medium text-gray-600">
            <a href="#" class="bg-purple-100 text-purple-600 px-4 py-1.5 rounded-full border border-purple-200">首頁</a>
            <a href="#about" class="hover:text-purple-600 transition">簡介</a>
            <a href="#education" class="hover:text-purple-600 transition">學歷</a>
            <a href="#experience" class="hover:text-purple-600 transition font-medium">經歷</a>
            <a href="#projects" class="hover:text-purple-600 transition">專案</a>
            <a href="https://github.com/yuwency" target="_blank" class="hover:text-purple-600 transition">GitHub</a>
            <a href="#contact" class="hover:text-purple-600 transition">聯絡方式</a>
        </nav>
    </header>

    <!-- 主體內容：毛玻璃個人卡片 -->
    <main class="relative z-10 w-[90%] max-w-3xl mt-24 mb-10">
        <div class="bg-white/40 backdrop-blur-xl border border-white/30 rounded-[40px] p-8 md:p-12 shadow-2xl flex flex-col items-center text-center">
            
            <!-- 大頭貼 (指向 images/avatar.jpg) -->
            <div class="w-32 h-32 md:w-36 md:h-36 rounded-full overflow-hidden border-4 border-white shadow-xl mb-6">
                <img src="images/avatar.jpg" alt="吳玉雯" class="w-full h-full object-cover">
            </div>

            <!-- 名字與左側紫色裝飾 -->
            <div class="relative inline-block mb-2">
                <div class="absolute left-0 top-0 bottom-0 w-3 bg-purple-500/80 rounded-l-lg transform -translate-x-4"></div>
                <h1 class="text-4xl md:text-5xl font-black text-slate-900 tracking-wide px-2 bg-purple-100/60 rounded-r-lg">
                    吳玉雯
                </h1>
            </div>

            <!-- 英文名字 -->
            <p class="text-xs md:text-sm font-semibold tracking-[0.3em] text-slate-500 uppercase mb-4">
                YU WEN WU
            </p>

            <!-- 學校與科系 -->
            <p class="text-sm md:text-base font-medium text-slate-700 mb-6 flex items-center justify-center gap-1">
                <span>國立聯合大學</span>
                <span class="text-slate-400">•</span>
                <span>資訊管理學系</span>
            </p>

            <!-- 專業標籤群 -->
            <div class="flex flex-wrap justify-center gap-3 mb-8">
                <span class="bg-purple-100/80 text-purple-600 border border-purple-200 text-xs md:text-sm font-semibold px-4 py-1.5 rounded-full shadow-sm hover:scale-105 transition duration-200">
                    UI/UX 介面設計
                </span>
                <span class="bg-purple-100/80 text-purple-600 border border-purple-200 text-xs md:text-sm font-semibold px-4 py-1.5 rounded-full shadow-sm hover:scale-105 transition duration-200">
                    前端網頁開發
                </span>
                <span class="bg-purple-100/80 text-purple-600 border border-purple-200 text-xs md:text-sm font-semibold px-4 py-1.5 rounded-full shadow-sm hover:scale-105 transition duration-200">
                    系統架構與資料庫
                </span>
            </div>

            <!-- 聯絡 Email -->
            <a href="mailto:yuwency@gmail.com" class="text-xs md:text-sm font-mono text-slate-600 hover:text-purple-700 hover:underline transition">
                yuwency@gmail.com
            </a>
        </div>
    </main>

    <!-- 背景自動輪播 JavaScript (全小寫 bg1.jpg ~ bg6.jpg) -->
    <script>
        const backgroundImages = [
            'images/bg1.jpg',
            'images/bg2.jpg',
            'images/bg3.jpg',
            'images/bg4.jpg',
            'images/bg5.jpg',
            'images/bg6.jpg'
        ];

        let currentIndex = 0;
        const bgCarousel = document.getElementById('bg-carousel');

        // 預載圖片
        backgroundImages.forEach(src => {
            const img = new Image();
            img.src = src;
        });

        function changeBackground() {
            currentIndex = (currentIndex + 1) % backgroundImages.length;
            bgCarousel.style.backgroundImage = `url('${backgroundImages[currentIndex]}')`;
        }

        // 每 5 秒自動切換背景照片
        setInterval(changeBackground, 5000);
    </script>
</body>
</html>
